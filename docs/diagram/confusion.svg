<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" width="580" height="300" role="img" aria-labelledby="t d">
<title id="t">Confusion matrix dan biaya kesalahan</title>
<desc id="d">Baris adalah kelas aktual dan kolom adalah prediksi. TN dan TP adalah prediksi benar. FP, yaitu prediksi batal padahal tamu datang, berbiaya 2 karena berisiko overbooking. FN, yaitu pembatalan yang tidak terdeteksi, berbiaya 1. Biaya total sama dengan 2 kali FP ditambah 1 kali FN.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59687d"/></marker></defs>
<rect x="1" y="1" width="578" height="298" rx="12" fill="#ffffff" stroke="#dce2e9"/>
<text x="330" y="30" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f">Prediksi</text>
<text x="255" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">0, tidak batal</text>
<text x="405" y="54" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">1, batal</text>
<text x="46" y="160" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f" transform="rotate(-90 46 160)">Aktual</text>
<text x="140" y="112" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">0</text>
<text x="140" y="202" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">1</text>
<rect x="182" y="66" width="146" height="86" rx="8" fill="#e9f6f0" stroke="#205c4a" stroke-width="2"/>
<text x="255" y="104" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f">TN, benar</text>
<text x="255" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">tamu datang</text>
<rect x="332" y="66" width="146" height="86" rx="8" fill="#e9f1fc" stroke="#1d5c9b" stroke-width="2"/>
<text x="405" y="104" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f">FP, biaya 2</text>
<text x="405" y="126" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">risiko overbooking</text>
<rect x="182" y="156" width="146" height="86" rx="8" fill="#e9f1fc" stroke="#1d5c9b" stroke-width="2"/>
<text x="255" y="194" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f">FN, biaya 1</text>
<text x="255" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">kamar kosong</text>
<rect x="332" y="156" width="146" height="86" rx="8" fill="#e9f6f0" stroke="#205c4a" stroke-width="2"/>
<text x="405" y="194" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#18212f">TP, benar</text>
<text x="405" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">batal terdeteksi</text>
<text x="330" y="274" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="end" fill="#18212f">Biaya total</text>
