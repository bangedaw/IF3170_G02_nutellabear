<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" width="780" height="350" role="img" aria-labelledby="t d">
<title id="t">Sigmoid dan daerah penalti regularisasi</title>
<desc id="d">Kiri: kurva sigmoid sigma(z) = 1/(1 + e^(-z)) dengan z = w transpos x + b, bernilai 0,5 pada z = 0 dan mendekati 0 dan 1 di kedua ujung. Kanan: pada bidang dua bobot w1 dan w2, daerah penalti L1 berbentuk belah ketupat, L2 berbentuk lingkaran, dan Elastic Net berada di antaranya. Kontur loss pertama kali menyentuh daerah L1 di sudut pada sumbu w2, sehingga w1 bernilai tepat nol.</desc>
