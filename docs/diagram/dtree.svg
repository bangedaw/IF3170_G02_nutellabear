<text x="380" y="266" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">Gain dihitung pada sampel yang nilainya diketahui, lalu dikali proporsi sampel diketahui.</text>
<text x="380" y="284" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">Split information memperlakukan nilai hilang sebagai satu partisi tambahan.</text>
<text x="380" y="302" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">Saat prediksi, nilai hilang menelusuri semua cabang; peluang daun digabung</text>
<text x="380" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#59687d">sesuai bobot cabang masing-masing.</text>
