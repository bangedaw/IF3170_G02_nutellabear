<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-labelledby="t d">
<title id="t">Bobot pecahan nilai hilang pada C4.5</title>
<desc id="d">Simpul menguji apakah days_before_arrival x kurang dari atau sama dengan t. Dari 100 sampel, 60 ke kiri, 30 ke kanan, dan 10 bernilai hilang. Peluang cabang kiri p = 60/90 dan kanan p = 30/90. Sepuluh sampel hilang dikirim ke kedua cabang dengan bobot 2/3 ke kiri dan 1/3 ke kanan.</desc>
