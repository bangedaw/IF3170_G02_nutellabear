<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d">
<title id="t">Ilustrasi k-Nearest Neighbors</title>
<desc id="d">Titik kueri x_q dikelilingi titik kelas 0 (lingkaran) dan kelas 1 (segitiga). Lingkaran putus-putus pertama memuat lima tetangga terdekat: tiga segitiga dan dua lingkaran, sehingga peluang batal sama dengan 3/5 = 0,6. Lingkaran kedua menunjukkan k yang lebih besar. Pada pembobotan jarak, w_i sama dengan 1 dibagi d(x_q, x_i).</desc>
