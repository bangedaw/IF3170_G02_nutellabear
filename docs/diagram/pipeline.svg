<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
<title id="t">Alur pengolahan data</title>
<desc id="d">train.csv dibagi berstrata 80:20 menjadi data latih dan validasi. Data latih dibersihkan, lalu PreparationPipeline di-fit hanya pada data latih bersih. Data validasi dan test.csv hanya di-transform. Pipeline menghasilkan tampilan numerik untuk KNN, regresi logistik, dan SVM, serta tampilan pohon untuk DTL C4.5 dan Naive Bayes. Keduanya mendahului evaluasi validasi dan submission Kaggle.</desc>
